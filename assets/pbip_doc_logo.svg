      </g>
      
      <!-- Nastrino Bianco -->
      <polygon points="33.2,12 41.2,7 41.2,34 37.2,30 33.2,37" fill="#FFFFFF" stroke="none" />
      <line x1="22" y1="19" x2="54" y2="-1" />
