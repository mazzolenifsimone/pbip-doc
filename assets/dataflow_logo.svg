<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Riquadro esterno con arrotondamento ridotto (rx="8") -->
  <rect x="10" y="10" width="80" height="80" rx="8" fill="none" stroke="#ffffff" stroke-width="7" />

  <!-- Connettore verticale e diramazione con curva più netta (raggio 7) -->
  <path d="M 38 32 V 68 M 38 50 H 57 A 5 5 0 0 0 62 45 V 32" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Nodi circolari bianchi equidistanti dalla diramazione -->
  <circle cx="38" cy="32" r="8" fill="#ffffff" />
  <circle cx="62" cy="32" r="8" fill="#ffffff" />
  <circle cx="38" cy="68" r="8" fill="#ffffff" />
</svg>