<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Riquadro esterno con arrotondamento ridotto (rx="8") -->
  <rect x="10" y="10" width="80" height="80" rx="8" fill="none" stroke="#ffffff" stroke-width="7" />

  <!-- Riga superiore (3 cerchi) -->
  <circle cx="29" cy="39" r="7" fill="#ffffff" />
  <circle cx="50" cy="39" r="7" fill="#ffffff" />
  <circle cx="71" cy="39" r="7" fill="#ffffff" />

  <!-- Riga inferiore (2 cerchi allineati a sinistra e al centro) -->
  <circle cx="29" cy="61" r="7" fill="#ffffff" />
  <circle cx="50" cy="61" r="7" fill="#ffffff" />
</svg>