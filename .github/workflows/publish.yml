name: Publish to PyPI

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      target:
        description: "Package index target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build:
    name: Build & Verify Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Unit Tests
        run: python -m unittest discover tests -v

      - name: Verify Release Tag Matches Package Version
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'import pbip_doc; print(pbip_doc.__version__)')"
          echo "Release tag version: $TAG_VERSION"
          echo "Package __version__: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch! Tag '$GITHUB_REF_NAME' ($TAG_VERSION) != pbip_doc.__version__ ($PKG_VERSION)"
            exit 1
          fi

      - name: Determine Release Ref for PyPI README Links
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "RELEASE_REF=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_REF=main" >> "$GITHUB_ENV"
          fi

      - name: Rewrite Relative README Links for PyPI
        run: |
          python - <<'EOF'
          import os
          import re
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          ref = os.environ["RELEASE_REF"]
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          text = re.sub(
              r"(?<![/\w])assets/pbip_doc_banner\.jpg",
              f"https://raw.githubusercontent.com/{repo}/{ref}/assets/pbip_doc_banner.jpg",
              text,
          )
          text = text.replace(
              "(ARCHITECTURE.md)",
              f"(https://github.com/{repo}/blob/{ref}/ARCHITECTURE.md)",
          )
          text = text.replace(
              "(LICENSE)",
              f"(https://github.com/{repo}/blob/{ref}/LICENSE)",
          )
          readme.write_text(text, encoding="utf-8")
          EOF

      - name: Install Build & Check Tools
        run: python -m pip install --upgrade build twine

      - name: Build Source Distribution and Wheel
        run: python -m build

      - name: Validate Distribution Metadata with Twine
        run: twine check dist/*

      - name: Smoke Test Built Wheel in Clean Venv
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          (
            cd /tmp
            /tmp/smoke-venv/bin/pbip-doc --help
            /tmp/smoke-venv/bin/pbip-doc docgen "${{ github.workspace }}/samples/Ecommerce_Sales" -o /tmp/smoke-out -f both
            test -f /tmp/smoke-out/html/index.html
            test -d /tmp/smoke-out/markdown
          )

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pbip-doc
    permissions:
      id-token: write

    steps:
      - name: Download Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pbip-doc
    permissions:
      id-token: write

    steps:
      - name: Download Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
